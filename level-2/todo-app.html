<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todo</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="js/todo.js" defer></script>
    </head>
    <body>
        <main class="relative">
            <div class="container mx-auto max-w-xl h-screen">
                <div class="flex flex-col justify-center items-center relative">
                    <h1 class="text-2xl font-medium my-20">TODO LIST</h1>
                    <div class="flex lg:flex-row lg:space-x-5 flex-col">
                        <div class="flex flex-row relative">
                            <input
                                type="search"
                                name="search"
                                class="border px-9 py-1 w-96 border-violet-500 shadow-violet-400 shadow-sm"
                                placeholder="Search note..."
                            />
                            <img
                                src="assets/search.svg"
                                alt="search"
                                class="h-7 w-7 left-1 top-1.5 text-violet-400 absolute"
                            />
                        </div>
                        <div class="flex flex-row relative">
                            <button
                                id="dropdown-btn"
                                data-dropdown-toggle="dropdown"
                                class="px-3 py-2 bg-violet-600 border-violet-600 border-2 group hover:bg-violet-800 focus:bg-violet-800 focus:border-violet-400 focus:border-2 text-white text-sm rounded-md w-28 font-bold flex justify-between"
                            >
                                ALL
                                <svg
                                    class="arrow w-8 h-5 pl-2 border-l cursor-pointer group-hover:bg-violet-800 group-focus:bg-violet-800 bg-violet-600 text-white"
                                    aria-hidden="true"
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="24"
                                    height="20"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke="currentColor"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="m19 9-7 7-7-7"
                                    />
                                </svg>
                            </button>
                            <div
                                id="dropdown"
                                class="z-20 hidden absolute w-28 top-10 border-violet-400 bg-white border border-default-medium rounded-md shadow-lg"
                            >
                                <ul
                                    class="text-sm text-body font-medium"
                                    aria-labelledby="dropdownDefaultButton"
                                >
                                    <li>
                                        <a
                                            id="all"
                                            href="#"
                                            class="inline-flex items-center w-full p-2 text-violet-500 hover:bg-violet-100 hover:text-heading"
                                            >All</a
                                        >
                                    </li>
                                    <li>
                                        <a
                                            id="active"
                                            href="#"
                                            class="inline-flex items-center w-full p-2 text-violet-500 hover:bg-violet-100 hover:text-heading"
                                            >Active</a
                                        >
                                    </li>
                                    <li>
                                        <a
                                            id="completed"
                                            href="#"
                                            class="inline-flex items-center w-full p-2 text-violet-500 hover:bg-violet-100 hover:text-heading"
                                            >Completed</a
                                        >
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div>
                            <button
                                id="openModal"
                                class="bg-violet-600 text-white rounded-full py-1 px-3 h-9 w-10 border-2 focus:bg-violet-800 focus:border-2 focus:border-violet-400 hover:bg-violet-800"
                            >
                                <svg
                                    viewBox="0 0 32 32"
                                    id="i-plus"
                                    xmlns="http://www.w3.org/2000/svg"
                                    fill="none"
                                    stroke="currentcolor"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="5"
                                >
                                    <g
                                        id="SVGRepo_bgCarrier"
                                        stroke-width="0"
                                    ></g>
                                    <g
                                        id="SVGRepo_tracerCarrier"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    ></g>
                                    <g id="SVGRepo_iconCarrier">
                                        <path
                                            d="M16 2 L16 30 M2 16 L30 16"
                                        ></path>
                                    </g>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div
                        id="noteList"
                        class="my-10 flex flex-col space-y-4 justify-center item-center w-3/4"
                    ></div>
                </div>

                <div class="flex justify-end">
                    <button
                        id="clear-all"
                        class="px-2 py-2 rounded-lg bg-red-700 text-white font-bold border hover:bg-white hover:border-red-700 hover:text-red-700"
                    >
                        Clear Completed
                    </button>
                </div>
                <div id="counter-wrapper" class="flex justify-end mt-5"></div>
            </div>
            <div
                id="modal"
                class="inset-0 hidden bg-black/60 fixed overflow-hidden"
            >
                <form
                    class="bg-white flex flex-col justify-center items-center mt-52 max-w-lg mx-auto rounded-md py-5 px-7"
                >
                    <h1 class="text-black font-bold text-2xl mb-6">NEW NOTE</h1>
                    <input
                        id="inputNote"
                        class="w-full rounded-md border-2 border-violet-300 px-4 py-1 cursor-text focus:outline-violet-400"
                        type="text"
                        name="new-note"
                        placeholder="Input your note..."
                    />
                    <div
                        class="flex flex-row justify-between items-center mt-48 w-full"
                    >
                        <button
                            id="closeModal"
                            class="py-1 px-4 border border-violet-600 text-violet-600 rounded-md font-medium hover:bg-red-600 hover:text-white"
                        >
                            CANCEL
                        </button>
                        <button
                            id="addNoteBtn"
                            type="submit"
                            class="py-1 px-4 border border-violet-600 hover:bg-white hover:text-violet-600 rounded-md font-medium bg-violet-600 text-white"
                        >
                            APPLY
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
