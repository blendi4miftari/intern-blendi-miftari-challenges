<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="js/kanban/main.js"></script>
</head>
<body>

                <div id="todo-column" class="w-full flex flex-1 flex-col space-y-6 min-w-0">
                    <div id="todo-header" class="w-full bg-blue-900 rounded-2xl flex flex-row justify-between items-center pr-2">
                        <div id="todo-title" class="flex flex-row space-x-2 p-2 items-center">
                            <span class="inline rounded-2xl text-sm bg-white text-blue-900 font-medium px-3 py-1 text-center">0</span>
                            <h1 class="text-lg text-white font-medium">To Do</h1>

                                <path d="M16 2 L16 30 M2 16 L30 16"></path> 
                            </svg>
                        </button>
                    </div>

                    </div>
                </div>

                <div id="inprogress-column" class="w-full flex flex-1 flex-col space-y-6 min-w-0">
                    <div id="inprogress-header" class="w-full bg-yellow-400 rounded-2xl flex flex-row justify-between items-center pr-2">
                        <div id="inprogress-title" class="flex flex-row space-x-2 p-2 items-center">
                            <span class="inline rounded-2xl text-sm bg-white text-yellow-400 font-medium px-3 py-1 text-center">0</span>
                            <h1 class="text-lg text-white font-medium">In Progress</h1>
                        </div>
                        <button id="inprogress-add-button" class="flex items-center justify-center h-8 w-8 rounded-full text-white hover:bg-yellow-300 transition-colors duration-200">
                            <svg viewBox="0 0 32 32" id="i-plus" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentcolor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" class="h-4 w-4">
                                <path d="M16 2 L16 30 M2 16 L30 16"></path> 
                            </svg>
                        </button>
                    </div>

                    <div id="inprogress-cards-wrapper" class="flex flex-col space-y-6 min-h-full min-w-0">

                    </div>

                </div>

                <div id="done-column" class="w-full flex flex-1 flex-col space-y-6 min-w-0">
                    <div id="done-header" class="w-full bg-green-500 rounded-2xl flex flex-row justify-between items-center pr-2">
                        <div id="done-title" class="flex flex-row space-x-2 p-2 items-center">
                            <span class="inline rounded-2xl text-sm bg-white text-green-500 font-medium px-3 py-1 text-center">0</span>
                            <h1 class="text-lg text-white font-medium">Done</h1>
                        </div>
                        <button id="done-add-button" class="flex items-center justify-center h-8 w-8 rounded-full text-white hover:bg-green-300 transition-colors duration-200">
                            <svg viewBox="0 0 32 32" id="i-plus" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentcolor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" class="h-4 w-4">
                                <path d="M16 2 L16 30 M2 16 L30 16"></path> 
                            </svg>
                        </button>
                    </div>

                    <div id="done-cards-wrapper" class="flex flex-col space-y-6 min-h-full min-w-0">
                        
                    </div>

                    
                </div>

            </div>

            <div
                id="modal"
                class="inset-0 hidden bg-black/60 fixed overflow-hidden"
            >
                <form
                    class="bg-white flex flex-col justify-center items-center mt-36 max-w-lg mx-auto rounded-md py-5 px-7"
                    >
                    <h1 class="text-black font-bold text-2xl mb-6">ADD A TASK</h1>
                        <div class="w-full flex flex-col space-y-2">
                            <label class="text-xl font-semibold" for="inputTitle">TITLE</label>
                            <input
                                id="inputTitle"
                                class="w-full rounded-md border-2 border-gray-300 px-4 py-1 cursor-text focus:outline-gray-400"
                                type="text"
                                name="new-title"
                                placeholder="Add a title"
                            />
                        </div>
                        <div class="w-full flex flex-col my-7 space-y-2">
                            <label class="text-xl font-semibold" for="inputDescription">DESCRIPTION</label>
                            <textarea
                                id="inputDescription"
                                class="w-full rounded-md border-2 border-gray-300 px-4 py-1 cursor-text focus:outline-gray-400"
                                type="text"
                                name="new-description"
                                placeholder="Add a description"
                            ></textarea>
                        </div>
                    <div
                        class="flex flex-row justify-between items-center mt-48 w-full"
                    >
                        <button
                            id="closeModal"
                            class="py-1 px-4 border border-gray-600 text-gray-600 rounded-md font-medium hover:bg-red-600 hover:text-white"
                        >
                            CANCEL
                        </button>
                        <button
                            id="addTaskBtn"
                            type="submit"
                            class="py-1 px-4 border border-green-600 hover:bg-white hover:text-green-600 rounded-md font-medium bg-green-600 text-white"
                        >
                            CREATE
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
