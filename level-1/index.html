<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="bg-slate-200  min-h-screen flex justify-center items-center">
        <div class="flex lg:flex-row flex-col bg-white rounded-md hover:shadow-lg shadow-black lg:hover:-translate-x-2 lg:hover:-translate-y-2 transition-all hover:scale-105">
            <div class="flex justify-center lg:rounded-l-md lg:rounded-r-none rounded-t-md lg:py-16 py-5 px-20 bg-slate-500">
                <img src="https://i.pravatar.cc/150" alt="profile pic" class="rounded-full  object-cover">
            </div>
            <div class="flex flex-col max-w-sm mx-4 items-center text-center m-5 space-y-4">
                <h3 class="text-slate-500 text-xl">Blendi Miftari</h3>
                <h2 class="text-lg text-slate-500">Programmer</h2>
                <p class="text-slate-600">Lorem ipsum dolor sit amet consectetur adipisicing elit.Incidunt impedit animi nulla delectus officia magnam minus dicta provident maiores iusto.</p>
                <div class="flex flex-row justify-center space-x-4 ">
                    <button class="bg-slate-700 text-white px-6 py-2 rounded-md border hover:bg-white hover:text-slate-700  hover:border-slate-700 focus:border-2">Follow</button>
                    <button class="hover:bg-slate-700 hover:text-white px-6 py-2 rounded-md border bg-white text-slate-700  border-slate-700 focus:border-2">Message</button>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
